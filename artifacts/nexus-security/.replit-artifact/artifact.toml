kind = "web"
previewPath = "/"
title = "Nexus Security"
version = "1.0.0"
id = "artifacts/nexus-security"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20270

[services.development]
run = "pnpm --filter @workspace/nexus-security run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexus-security", "run", "build" ]
publicDir = "artifacts/nexus-security/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20270"
BASE_PATH = "/"
