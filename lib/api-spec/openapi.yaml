    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        credits:
          type: integer
        isAdmin:
          type: boolean
        role:
          type: string
        isSuperAdmin:
          type: boolean
        isBanned:
          type: boolean
        isSuspended:
          type: boolean
        currentPlan:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        scansUsed:
          type: integer
        scansCompleted:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - credits
        - isAdmin
        - createdAt

    RegisterInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        confirmPassword:
          type: string
      required:
        - name
        - email
        - password
        - confirmPassword

    EmailVerifyInput:
      type: object
      properties:
        email:
          type: string
        code:
          type: string
      required:
        - email
        - code

    ScanCallbackInput:
      type: object
      properties:
        scanId:
          type: string
        reportUrl:
          type: ["string", "null"]
        status:
          type: string
      required:
        - scanId
        - status

    LoginCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
      required:
        - email
        - password

    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
        - currentPassword
        - newPassword

    ResendVerificationInput:
      type: object
      properties:
        email:
          type: string
      required:
        - email

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
      required:
        - email

    ResetPasswordInput:
      type: object
      properties:
        email:
          type: string
        code:
          type: string
        newPassword:
          type: string
      required:
        - email
